$kind: http-request
name: Update armor class
url: "{{baseUrl}}/api/v1/characters/{{characterId}}/armor-class"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "armorClassOverride": 18
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();

      pm.test("armor class override applied", function () {
        pm.response.to.have.status(200);
        pm.expect(body.armorClassOverride).to.equal(18);
        pm.expect(body.armorClass).to.equal(18);
      });
order: 76
