$kind: http-request
name: Update death saves
url: "{{baseUrl}}/api/v1/characters/{{characterId}}/death-saves"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "successes": 1,
      "failures": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();

      pm.test("the death saves are updated and the character keeps dying", function () {
        pm.response.to.have.status(200);
        pm.expect(body.deathSaves.successes).to.equal(1);
        pm.expect(body.deathSaves.failures).to.equal(2);
        pm.expect(body.lifeStatus).to.equal("DYING");
      });
order: 70
